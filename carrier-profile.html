<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rateware Carrier Profile</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/platform55-tokens.css" />
    <link rel="stylesheet" href="./src/platform55-public-shell.css" />
    <link rel="stylesheet" href="./src/platform55-public.css" />
  </head>
  <body class="bid-portal-page p55-v5-page p55-v5-page--public" data-platform55-shell="public" data-platform55-page="carrier-profile" data-p3v5-family="public">
    <main class="bid-portal-shell carrier-profile-portal rw-public-app p55-v5-public-shell" data-platform55-public-app>
      <section class="bid-portal-header rw-public-header" data-platform55-public-context>
        <a class="brand-mark" href="./index.html">Rateware</a>
        <div>
          <p id="carrier-profile-eyebrow" class="eyebrow">Private carrier profile</p>
          <h1 id="carrier-profile-title">Loading carrier profile...</h1>
        </div>
      </section>

      <aside class="p55-v5-context-banner" data-p3v5-boundary="public" aria-label="Carrier profile boundary">
        <span class="p55-v5-context-mark" aria-hidden="true">P</span>
        <div><strong>Private carrier profile · access is scoped to this request</strong><p>Only the signed carrier context is shown. No tenant workspace, carrier directory, or procurement controls are exposed.</p></div>
      </aside>

      <section id="carrier-profile-card" class="workspace-panel rw-public-workspace">
        <p id="carrier-profile-status" class="status-message rw-public-state" role="status" data-platform55-public-state data-state="loading">Loading profile request...</p>
      </section>
    </main>

    <script type="module" src="./src/carrier-profile.js"></script>
  </body>
</html>
