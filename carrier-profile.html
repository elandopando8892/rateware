<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rateware Carrier Profile</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/platform55-tokens.css" />
    <link rel="stylesheet" href="./src/platform55-public-shell.css" />
  </head>
  <body class="bid-portal-page" data-platform55-shell="public" data-platform55-page="carrier-profile">
    <main class="bid-portal-shell carrier-profile-portal rw-public-app" data-platform55-public-app>
      <section class="bid-portal-header rw-public-header" data-platform55-public-context>
        <a class="brand-mark" href="./index.html">Rateware</a>
        <div>
          <p id="carrier-profile-eyebrow" class="eyebrow">Private carrier profile</p>
          <h1 id="carrier-profile-title">Loading carrier profile...</h1>
        </div>
      </section>

      <section id="carrier-profile-card" class="workspace-panel rw-public-workspace">
        <p id="carrier-profile-status" class="status-message rw-public-state" role="status" data-platform55-public-state data-state="loading">Loading profile request...</p>
      </section>
    </main>

    <script type="module" src="./src/carrier-profile.js"></script>
  </body>
</html>
