<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/styles.css" />

  <body class="shipper-profile-page p55-v5-page p55-v5-page--public" data-platform55-shell="public" data-platform55-page="shipper-profile" data-p3v5-family="public">
    <main class="shipper-profile-shell rw-public-app p55-v5-public-shell" data-platform55-public-app>
      <header class="shipper-profile-header rw-public-header" data-platform55-public-context><a class="brand-mark" href="./index.html">Rateware</a><div><span id="shipper-profile-status">Secure customer profile</span><button id="shipper-language" class="secondary" type="button">ES</button></div></header>
      <aside class="p55-v5-context-banner" data-p3v5-boundary="public" aria-label="Customer profile boundary">
        <span class="p55-v5-context-mark" aria-hidden="true">P</span>
        <div><strong>Secure customer profile · signed context only</strong><p>Complete the requested profile without exposing internal CRM, carrier, or tenant controls.</p></div>
      </aside>
      <section id="shipper-profile-root" class="workspace-panel rw-public-workspace rw-public-state rw-network-service-state" data-platform55-public-state data-state="loading"><p>Loading secure profile...</p></section>
    </main>
    <script type="module" src="./src/shipper-profile.js"></script>
