name: build17-pubsub-phase0-patch

on:
  push:
    branches:
      - provider-service-build17-pubsub-inbound
    paths:
      - .github/workflows/build17-pubsub-phase0-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Build 17
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provider-service-build17-pubsub-inbound
          fetch-depth: 0
      - name: Register fixed PubSub route and deploy-readiness config
        run: |
          node <<'NODE'
          const fs = require('fs');

          const libPath = 'tools/action-contract-lib.mjs';
          let lib = fs.readFileSync(libPath, 'utf8');
          const fixedAnchor = `["provider-gmail-oauth-callback", [["complete_provider_gmail_oauth_callback", "GET /functions/v1/provider-gmail-oauth-callback?code&state", "external-tokenized"]]],`;
          const fixedInsertion = `${fixedAnchor}\n  ["provider-gmail-push", [["receive_provider_gmail_push", "POST /functions/v1/provider-gmail-push", "external-tokenized"]]],`;
          if ((lib.split(fixedAnchor).length - 1) !== 1) throw new Error('Expected exactly one Provider Gmail OAuth fixed route.');
          if (lib.includes('receive_provider_gmail_push')) throw new Error('Provider Gmail push route already registered.');
          lib = lib.replace(fixedAnchor, fixedInsertion);
          fs.writeFileSync(libPath, lib);

          const configPath = 'supabase/config.toml';
          let config = fs.readFileSync(configPath, 'utf8');
          const configAnchor = `[functions.provider-gmail-oauth-callback]\nverify_jwt = false`;
          const configInsertion = `${configAnchor}\n\n# Pub/Sub authenticates with a Google-signed OIDC token verified inside the function.\n[functions.provider-gmail-push]\nverify_jwt = false`;
          if ((config.split(configAnchor).length - 1) !== 1) throw new Error('Expected exactly one Provider Gmail OAuth config anchor.');
          if (config.includes('[functions.provider-gmail-push]')) throw new Error('Provider Gmail push config already exists.');
          config = config.replace(configAnchor, configInsertion);
          fs.writeFileSync(configPath, config);

          const testPath = 'tests/provider-service-gmail-pubsub.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const readAnchor = `const push = read('../supabase/functions/provider-gmail-push/index.ts');`;
          if ((test.split(readAnchor).length - 1) !== 1) throw new Error('Expected exactly one PubSub test read anchor.');
          test = test.replace(readAnchor, `${readAnchor}\nconst config = read('../supabase/config.toml');`);
          test += `\n\ntest('Pub/Sub push bypasses only the Supabase JWT gateway and verifies Google OIDC internally', () => {\n  assert.match(config, /\\[functions\\.provider-gmail-push\\]\\s+verify_jwt = false/);\n  assert.match(push, /verifyProviderPubSubRequest\\(request\\)/);\n  assert.match(auth, /crypto\\.subtle\\.verify/);\n});\n`;
          fs.writeFileSync(testPath, test);
          NODE
      - name: Validate and commit patch
        run: |
          npm ci --ignore-scripts
          node --test tests/provider-service-gmail-pubsub.test.mjs
          node tools/validate-provider-service-runtime-syntax.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/action-contract-lib.mjs supabase/config.toml tests/provider-service-gmail-pubsub.test.mjs
          git commit -m "fix(build17): make Gmail PubSub route Phase 0 discoverable"
          git push origin HEAD:provider-service-build17-pubsub-inbound
