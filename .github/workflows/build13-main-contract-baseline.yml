name: build13-main-contract-baseline

on:
  push:
    branches:
      - provider-service-convergence-hardening
    paths:
      - .github/workflows/build13-main-contract-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run legacy action contract test on main
        run: node tests/action-contract.test.mjs
