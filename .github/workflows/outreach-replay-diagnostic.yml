name: outreach-replay-diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/outreach-replay-diagnostic.yml
      - tools/diagnose-outreach-replay.py

permissions:
  contents: read

jobs:
  catalog-before-guard:
    name: Inspect isolated pre-October-7 function definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install existing pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.114.0
      - name: Inspect isolated migration-prefix catalog
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: python3 tools/diagnose-outreach-replay.py
      - name: Stop isolated diagnostic stack
        if: always()
        run: supabase stop --no-backup || true
