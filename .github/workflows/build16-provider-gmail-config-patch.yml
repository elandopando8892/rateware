name: build16-provider-gmail-config-patch

on:
  push:
    branches:
      - provider-service-build16-gmail-intake
    paths:
      - .github/workflows/build16-provider-gmail-config-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Build 16
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provider-service-build16-gmail-intake
          fetch-depth: 0
      - name: Add Provider Gmail deploy-readiness config and regression
        run: |
          node <<'NODE'
          const fs = require('fs');

          const configPath = 'supabase/config.toml';
          let config = fs.readFileSync(configPath, 'utf8');
          const anchor = `[functions.shipper-directory-api]\nverify_jwt = false`;
          const insertion = `${anchor}\n\n# Provider Gmail uses Kinde for the operator API and a one-time OAuth state for\n# the Google callback. Both functions perform authentication inside the runtime.\n[functions.provider-gmail-intake-api]\nverify_jwt = false\n\n[functions.provider-gmail-oauth-callback]\nverify_jwt = false`;
          if ((config.split(anchor).length - 1) !== 1) throw new Error('Expected exactly one shipper-directory-api config anchor.');
          if (config.includes('[functions.provider-gmail-intake-api]') || config.includes('[functions.provider-gmail-oauth-callback]')) {
            throw new Error('Provider Gmail function config already exists.');
          }
          config = config.replace(anchor, insertion);
          fs.writeFileSync(configPath, config);

          const testPath = 'tests/provider-service-gmail-intake.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const readAnchor = `const controller = read('../src/provider-gmail-page.js');`;
          const readInsertion = `${readAnchor}\nconst supabaseConfig = read('../supabase/config.toml');`;
          if ((test.split(readAnchor).length - 1) !== 1) throw new Error('Expected exactly one Gmail test read anchor.');
          test = test.replace(readAnchor, readInsertion);

          const testAnchor = `test('Provider Gmail UI is private and cannot expose outbound controls', () => {`;
          const deployTest = `test('Provider Gmail Edge functions bypass only the Supabase JWT gateway and keep runtime auth', () => {\n  assert.match(supabaseConfig, /\\[functions\\.provider-gmail-intake-api\\]\\s+verify_jwt = false/);\n  assert.match(supabaseConfig, /\\[functions\\.provider-gmail-oauth-callback\\]\\s+verify_jwt = false/);\n  assert.match(api, /requireKindeUser\\(request\\)/);\n  assert.match(callback, /provider_gmail_oauth_states/);\n});\n\n${testAnchor}`;
          if ((test.split(testAnchor).length - 1) !== 1) throw new Error('Expected exactly one Gmail UI test anchor.');
          test = test.replace(testAnchor, deployTest);
          fs.writeFileSync(testPath, test);
          NODE
      - name: Validate and commit deploy-readiness patch
        run: |
          npm ci --ignore-scripts
          node --test tests/provider-service-gmail-intake.test.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/config.toml tests/provider-service-gmail-intake.test.mjs
          git commit -m "chore(build16): make Provider Gmail functions deploy-ready"
          git push origin HEAD:provider-service-build16-gmail-intake
