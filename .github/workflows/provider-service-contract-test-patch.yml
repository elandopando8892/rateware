name: provider-service-contract-envelope-diagnostic

on:
  push:
    branches:
      - provider-service-convergence-hardening
    paths:
      - '.github/workflows/provider-service-contract-test-patch.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provider-service-convergence-hardening
          fetch-depth: 0

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Materialize main worktree
        run: git worktree add ../rateware-main origin/main

      - name: Compare legacy source and authorization envelopes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { discoverGovernableSurfaces, semanticTokens } from './tools/action-contract-lib.mjs';

          const branchRoot = process.cwd();
          const mainRoot = resolve('../rateware-main');
          const branch = discoverGovernableSurfaces(branchRoot);
          const main = discoverGovernableSurfaces(mainRoot);
          const branchById = new Map(branch.map((entry) => [entry.canonicalId, entry]));
          const mainById = new Map(main.map((entry) => [entry.canonicalId, entry]));
          const dependencyImpact = new Map();
          const sourceChanges = [];
          const envelopeChanges = [];

          const semantic = (root, path) => {
            try { return semanticTokens(readFileSync(resolve(root, path), 'utf8')); }
            catch { return null; }
          };

          for (const [canonicalId, base] of mainById) {
            const next = branchById.get(canonicalId);
            if (!next) continue;
            if (base.sourceFingerprint !== next.sourceFingerprint) {
              sourceChanges.push({ canonicalId, sourceFile: next.sourceFile, before: base.sourceFingerprint, after: next.sourceFingerprint });
            }
            if (base.authorizationFingerprint !== next.authorizationFingerprint) {
              const allDeps = new Set([...(base.dependencyFiles || []), ...(next.dependencyFiles || [])]);
              const changedDeps = [];
              for (const path of allDeps) {
                if (semantic(mainRoot, path) !== semantic(branchRoot, path)) {
                  changedDeps.push(path);
                  dependencyImpact.set(path, (dependencyImpact.get(path) || 0) + 1);
                }
              }
              envelopeChanges.push({ canonicalId, changedDeps, beforeDeps: base.dependencyFiles, afterDeps: next.dependencyFiles });
            }
          }

          console.log(JSON.stringify({
            mainCount: main.length,
            branchCount: branch.length,
            sourceChangeCount: sourceChanges.length,
            envelopeChangeCount: envelopeChanges.length,
            dependencyImpact: [...dependencyImpact.entries()].sort((a,b)=>b[1]-a[1]),
            sourceChanges,
            envelopeSamples: envelopeChanges.slice(0, 12),
          }, null, 2));
          NODE
