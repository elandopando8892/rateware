name: build17-capture-auth-error

on:
  push:
    branches:
      - provider-service-build17-pubsub-inbound
    paths:
      - .github/workflows/build17-capture-auth-error.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provider-service-build17-pubsub-inbound
          fetch-depth: 0
      - run: npm ci --ignore-scripts
      - name: Capture duplicate guard metadata state
        run: |
          git fetch origin main:refs/remotes/origin/main
          rm -rf /tmp/rateware-main
          git worktree add --detach /tmp/rateware-main origin/main
          node --input-type=module <<'NODE' > build17-auth-diagnostic.txt 2>&1
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          import { ACTION_CONTRACT as CURRENT } from './tools/effective-action-contract.mjs';
          import { discoverGovernableSurfaces, metadataFingerprint, validateActionContract } from './tools/action-contract-lib.mjs';
          const baselineUrl = pathToFileURL(resolve('/tmp/rateware-main/supabase/functions/_shared/action-contract.mjs')).href;
          const { ACTION_CONTRACT: BASELINE } = await import(`${baselineUrl}?diag=${Date.now()}`);
          const id = 'rpc.public.provider_service_guard_exception_approval()';
          const matches = () => CURRENT.surfaces.filter((item) => item.canonicalId === id).map((entry, index) => ({ index, hash: metadataFingerprint(entry), entry }));
          console.log('reviewed=' + CURRENT.reviewedMetadataFingerprints[id]);
          console.log('before=' + JSON.stringify(matches()));
          const baselineResult = validateActionContract(BASELINE, discoverGovernableSurfaces('/tmp/rateware-main'), { repoRoot: '/tmp/rateware-main' });
          console.log('after_baseline=' + JSON.stringify(matches()));
          const currentResult = validateActionContract(CURRENT, discoverGovernableSurfaces(process.cwd()), { repoRoot: process.cwd() });
          console.log('after_current=' + JSON.stringify(matches()));
          console.log('guard_issues=' + JSON.stringify(currentResult.issues.filter((issue) => issue.canonicalId === id)));
          console.log('duplicate_issues=' + JSON.stringify(currentResult.issues.filter((issue) => issue.code === 'DUPLICATE_CANONICAL_ID' && issue.canonicalId === id)));
          console.log(`baseline_errors=${baselineResult.issues.filter((issue) => issue.level === 'error').length}`);
          NODE
          set +e
          node tools/validate-action-contract-no-regression.mjs --baseline-root /tmp/rateware-main >> build17-auth-diagnostic.txt 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> build17-auth-diagnostic.txt
          cat build17-auth-diagnostic.txt
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build17-auth-diagnostic.txt
          git commit -m "chore(build17): refresh guard authorization diagnostic"
          git push origin HEAD:provider-service-build17-pubsub-inbound
