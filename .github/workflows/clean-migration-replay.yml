name: clean-migration-replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/shipper-directory-api/**'
      - 'supabase/config.toml'
      - 'supabase/functions/_shared/action-contract*.mjs'
      - 'src/provider-service-*.js'
      - 'src/provider-service-360.css'
      - 'src/vendor-service.js'
      - 'tests/provider-service-*.test.mjs'
      - 'tests/action-contract.test.mjs'
      - 'tools/action-contract-*.mjs'
      - 'tools/effective-action-contract.mjs'
      - 'tools/verify-migration-history.mjs'
      - 'tools/validate-action-contract-delta.mjs'
      - 'tools/validate-provider-service-runtime-syntax.mjs'
      - '.github/workflows/clean-migration-replay.yml'
  workflow_dispatch:

jobs:
  replay:
    name: Replay Supabase migrations from zero
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.114.0

      - name: Verify replay toolchain
        run: |
          test "$(supabase --version)" = "2.114.0"
          node --version
          docker --version

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Validate migration history
        run: node tools/verify-migration-history.mjs

      - name: Validate Provider Service runtime syntax
        run: node tools/validate-provider-service-runtime-syntax.mjs

      - name: Run full Provider Service test suite
        run: node --test tests/provider-service-*.test.mjs

      - name: Gate authorization contract delta
        run: node tools/validate-action-contract-delta.mjs

      - name: Run existing Rateware regression suite
        run: npm test

      - name: Start clean local Supabase database
        run: supabase db start

      - name: Replay every migration from scratch
        run: supabase db reset --local

      - name: Dump resulting public schema
        run: supabase db dump --local --schema public --file /tmp/rateware-public-schema.sql

      - name: Verify canonical tenant objects survived replay
        run: |
          grep -q 'organizations' /tmp/rateware-public-schema.sql
          grep -q 'workspace_registry' /tmp/rateware-public-schema.sql
          echo 'Canonical tenant objects PASS.'

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
