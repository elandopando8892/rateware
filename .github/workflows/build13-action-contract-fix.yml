name: build13-action-contract-restore

on:
  push:
    branches:
      - provider-service-convergence-hardening
    paths:
      - .github/workflows/build13-action-contract-fix.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provider-service-convergence-hardening
          fetch-depth: 0
      - name: Restore legacy regression test bit-for-bit from main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- tests/action-contract.test.mjs
          git diff --exit-code origin/main -- tests/action-contract.test.mjs
      - name: Commit restored legacy test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/action-contract.test.mjs
          if git diff --cached --quiet; then
            echo 'Legacy action-contract test already matches main.'
            exit 0
          fi
          git diff --cached --check
          git commit -m "test(build13): restore legacy action-contract regression baseline"
          git push origin HEAD:provider-service-convergence-hardening
