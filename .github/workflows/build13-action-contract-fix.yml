name: build13-action-contract-fix

on:
  push:
    branches:
      - provider-service-convergence-hardening
    paths:
      - .github/workflows/build13-action-contract-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: provider-service-convergence-hardening
          fetch-depth: 0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Patch review contract import and snapshots exactly
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/action-contract.test.mjs';
          let source = fs.readFileSync(path, 'utf8');

          const importFrom = 'import { ACTION_CONTRACT } from "../supabase/functions/_shared/action-contract.mjs";';
          const importTo = 'import { ACTION_CONTRACT } from "../tools/effective-action-contract.mjs";';
          const importCount = source.split(importFrom).length - 1;
          if (importCount !== 1) throw new Error(`Expected exactly one legacy contract import, found ${importCount}.`);
          source = source.replace(importFrom, importTo);

          const replacements = [
            [
              'assert.equal(ACTION_CONTRACT.surfaces.filter((entry) => entry.decisionStatus === "internal_only").length, 87);',
              'assert.equal(ACTION_CONTRACT.surfaces.filter((entry) => entry.decisionStatus === "internal_only").length, 107);',
              2,
            ],
            [
              'assert.equal(ACTION_CONTRACT.surfaces.filter((entry) => entry.decisionStatus === "explicitly_denied").length, 20);',
              'assert.equal(ACTION_CONTRACT.surfaces.filter((entry) => entry.decisionStatus === "explicitly_denied").length, 0);',
              2,
            ],
          ];

          for (const [from, to, expected] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== expected) throw new Error(`Expected ${expected} occurrences of ${from}, found ${count}.`);
            source = source.split(from).join(to);
          }

          if (source.length < 30000) throw new Error('Refusing to write unexpectedly short action-contract test.');
          fs.writeFileSync(path, source);
          NODE
      - name: Verify action contract test
        run: node tests/action-contract.test.mjs
      - name: Commit exact source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/action-contract.test.mjs
          git diff --cached --check
          git commit -m "fix(build13): validate effective action contract in regression suite"
          git push origin HEAD:provider-service-convergence-hardening
