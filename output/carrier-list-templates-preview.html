<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, noarchive" />
    <title>Rateware · Carrier list templates preview</title>
    <link rel="stylesheet" href="../src/platform55-tokens.css" />
    <link rel="stylesheet" href="../src/platform55-shell.css" />
    <link rel="stylesheet" href="../src/platform55-procurement.css" />
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body class="carrier-template-preview-page" data-platform55-shell="tenant">
    <a class="rw-skip-link" href="#preview-content">Skip to preview content</a>
    <div class="rw-app" data-platform55-app data-nav-collapsed="false" data-mobile-nav-open="false">
      <aside class="rw-sidebar" aria-label="Rateware preview navigation">
        <div class="rw-brand-row">
          <button class="rw-brand preview-brand-button" type="button" data-preview-route="library" aria-label="Open Carrier CRM template library"><span>R</span><strong>Rateware</strong></button>
          <button class="rw-icon-button rw-mobile-close" type="button" data-preview-mobile-nav="close" aria-label="Close navigation"><rw-icon name="close"></rw-icon></button>
        </div>
        <button class="rw-nav-collapse" type="button" data-preview-nav-collapse aria-controls="preview-navigation" aria-expanded="true" aria-label="Collapse navigation">
          <rw-icon name="chevron"></rw-icon><span>Collapse navigation</span>
        </button>
        <nav id="preview-navigation" class="rw-nav" aria-label="Product navigation">
          <section class="rw-nav-group">
            <p>Operate</p>
            <button class="rw-nav-link" type="button" aria-label="Command Center" data-preview-shell-action="Command Center"><rw-icon name="command"></rw-icon><span>Command Center</span></button>
            <button class="rw-nav-link" type="button" aria-label="Import" data-preview-shell-action="Import"><rw-icon name="upload"></rw-icon><span>Import</span></button>
            <button class="rw-nav-link" type="button" aria-label="Source Files" data-preview-shell-action="Source Files"><rw-icon name="source"></rw-icon><span>Source Files</span></button>
            <button class="rw-nav-link" type="button" aria-label="Review Queue" data-preview-shell-action="Review Queue"><rw-icon name="review"></rw-icon><span>Review Queue</span></button>
            <button class="rw-nav-link" type="button" aria-label="Rateware" data-preview-shell-action="Rateware"><rw-icon name="rate"></rw-icon><span>Rateware</span></button>
          </section>
          <section class="rw-nav-group">
            <p>Analyze</p>
            <button class="rw-nav-link" type="button" aria-label="Analyze" data-preview-shell-action="Analyze"><rw-icon name="command"></rw-icon><span>Analyze</span></button>
          </section>
          <section class="rw-nav-group is-active">
            <p>Source</p>
            <button class="rw-nav-link" type="button" aria-label="Carrier CRM" data-preview-route="library" data-preview-nav-key="carrier-crm"><rw-icon name="carrier"></rw-icon><span>Carrier CRM</span></button>
            <button class="rw-nav-link" type="button" aria-label="RFx Process" data-preview-shell-action="RFx Process"><rw-icon name="rfx"></rw-icon><span>RFx Process</span></button>
            <button class="rw-nav-link" type="button" aria-label="Bid Room" data-preview-route="carrier-fit" data-preview-nav-key="bid-room"><rw-icon name="work"></rw-icon><span>Bid Room</span></button>
            <button class="rw-nav-link" type="button" aria-label="Vendor Support" data-preview-shell-action="Vendor Support"><rw-icon name="user"></rw-icon><span>Vendor Support</span></button>
            <button class="rw-nav-link" type="button" aria-label="Vendor CI" data-preview-shell-action="Vendor CI"><rw-icon name="source"></rw-icon><span>Vendor CI</span></button>
          </section>
          <section class="rw-nav-group">
            <p>Admin</p>
            <button class="rw-nav-link" type="button" aria-label="Settings" data-preview-shell-action="Settings"><rw-icon name="settings"></rw-icon><span>Settings</span></button>
            <button class="rw-nav-link" type="button" aria-label="Learning Rules" data-preview-shell-action="Learning Rules"><rw-icon name="catalog"></rw-icon><span>Learning Rules</span></button>
          </section>
        </nav>
        <div class="rw-sidebar-footer"><span>Carrier templates QA</span><small>Deterministic local preview</small></div>
      </aside>

      <button class="rw-nav-scrim" type="button" data-preview-mobile-nav="close" aria-label="Close navigation"></button>
      <div class="rw-workspace">
        <header class="rw-topbar">
          <button class="rw-icon-button rw-mobile-menu" type="button" data-preview-mobile-nav="open" aria-label="Open navigation"><rw-icon name="menu"></rw-icon></button>
          <button class="rw-search-trigger" type="button" data-preview-search-trigger aria-label="Focus the current preview search">
            <rw-icon name="search"></rw-icon><span>Search modules and actions...</span><kbd>Ctrl K</kbd>
          </button>
          <div class="rw-topbar-actions">
            <button class="rw-icon-button rw-notification-button" type="button" data-preview-shell-action="Notifications" aria-label="Preview notifications"><rw-icon name="bell"></rw-icon><b>0</b></button>
            <button class="rw-ask-ai preview-topbar-button" type="button" data-preview-shell-action="Ask AI"><rw-icon name="ai"></rw-icon><span>Ask AI</span></button>
            <span class="preview-user" aria-label="Signed in preview user"><b>JA</b><strong>Jose Andres</strong></span>
          </div>
        </header>
        <aside class="preview-safety-banner" role="note">
          <rw-icon name="warning"></rw-icon>
          <strong>Preview con datos simulados · sin acciones externas</strong>
        </aside>
        <main id="preview-content" class="preview-main" tabindex="-1">
          <div class="preview-loading">Loading local preview…</div>
        </main>
        <p class="sr-only" data-preview-live role="status" aria-live="polite"></p>
      </div>
    </div>
    <script type="module" src="../src/carrier-list-templates-preview.js"></script>
  </body>
</html>
